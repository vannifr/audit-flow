# SonarQube configuration for audit-flow
sonar.projectKey=audit-flow
sonar.projectName=Audit Flow
sonar.projectVersion=1.0.0

# Source code
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.test.ts

# Coverage
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/test/**,**/tests/**

# Code quality
sonar.typescript.tsconfigPath=tsconfig.json
sonar.exclusions=node_modules/**,dist/**,lib/**,coverage/**

# Quality gates
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Analysis scope
sonar.sourceEncoding=UTF-8